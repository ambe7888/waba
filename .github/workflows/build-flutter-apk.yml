name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    # On définit le dossier de travail par défaut pour toutes les étapes 'run'
    defaults:
      run:
        working-directory: ./whatsclick_mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch Outdated Gradle Configs
        working-directory: ./
        run: |
          find ~/.pub-cache/hosted/pub.dev -name build.gradle -exec sed -i 's/flutter.compileSdkVersion/34/g' {} + 2>/dev/null || true
          find ~/.pub-cache/hosted/pub.dev -name build.gradle -exec sed -i 's/flutter.minSdkVersion/21/g' {} + 2>/dev/null || true
          find ~/.pub-cache/hosted/pub.dev -name build.gradle -exec sed -i 's/flutter.targetSdkVersion/34/g' {} + 2>/dev/null || true

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsClick-Mobile-APK
          path: whatsclick_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: whatsclick_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
