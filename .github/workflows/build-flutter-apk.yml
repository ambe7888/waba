name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
             - name: Install Dependencies
        run: |
          PROJECT_DIR=$(find . -maxdepth 2 -name "pubspec.yaml" -type f -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR: Aucun projet Flutter (pubspec.yaml) trouvé!"
            echo "Répertoires disponibles:"
            ls -la
            exit 1
          fi
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Patch Outdated Gradle Configs
        run: |
          find ~/.pub-cache/hosted/pub.dev -name build.gradle -exec sed -i 's/flutter.compileSdkVersion/34/g' {} + 2>/dev/null || true
          find ~/.pub-cache/hosted/pub.dev -name build.gradle -exec sed -i 's/flutter.minSdkVersion/21/g' {} + 2>/dev/null || true
          find ~/.pub-cache/hosted/pub.dev -name build.gradle -exec sed -i 's/flutter.targetSdkVersion/34/g' {} + 2>/dev/null || true

      - name: Build APK (Release)
        run: |
          PROJECT_DIR=""
          if [ -d "whatsclick_mobile" ]; then
            PROJECT_DIR="whatsclick_mobile"
          elif [ -d "whatsjet_mobile" ]; then
                  - name: Build APK (Release)
        run: |
          PROJECT_DIR=$(find . -maxdepth 2 -name "pubspec.yaml" -type f -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR: Aucun projet Flutter (pubspec.yaml) trouvé!"
            exit 1
          fi
          cd "$PROJECT_DIR"
          flutter build apk --release
          if [ -z "$path" ]; then
            echo "ERROR: No app-release.apk found!"
            exit 1
          fi
          echo "APK_PATH=$path" >> $GITHUB_ENV
          echo "Found APK at: $path"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsClick-Mobile-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
