name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: actions/subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          if [ -d "ancien app" ]; then
            cd "ancien app"
          fi
          flutter pub get

      - name: Build APK (Release)
        run: |
          if [ -d "ancien app" ]; then
            cd "ancien app"
          fi
          flutter build apk --release

      - name: Find & Locate Generated APK
        id: locate_apk
        run: |
          if [ -f "ancien app/build/app/outputs/flutter-apk/app-release.apk" ]; then
            path="ancien app/build/app/outputs/flutter-apk/app-release.apk"
          elif [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            path="build/app/outputs/flutter-apk/app-release.apk"
          else
            path=$(find . -name "app-release.apk" | head -n 1)
          fi
          echo "APK_PATH=$path" >> $GITHUB_ENV
          echo "Found APK at: $path"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsClick-Mobile-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
